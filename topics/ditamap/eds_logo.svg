<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="380" height="200">
  <defs>
    <!-- Light Gray Gradients for Soft, Elegant Look -->
    <linearGradient id="mainTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9BB0" />
      <stop offset="100%" stop-color="#6F8095" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8C4D0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="markDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="markLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9BB0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Logo Group -->
  <g transform="translate(70, 115)">
    
    <!-- GRAPHIC MARK: Open Book / Integrated Lowercase 'e' (Light Grays with Transparency) -->
    <g transform="translate(0, 0)">
      
      <!-- Back Page / Spine Shade -->
      <path d="M 30,70 C 30,70 65,160 120,230 C 90,200 40,190 30,175 Z" fill="url(#markDarkGrad)" opacity="0.6" />

      <!-- Left Page Curve -->
      <path d="M 30,70 C 80,70 110,130 120,230 C 80,210 30,170 30,70 Z" fill="url(#markLightGrad)" />

      <!-- Main Lowercase 'e' Loop forming right page -->
      <path d="M 80,185 C 130,225 210,215 220,150 C 230,80 150,80 100,150 C 70,192 130,235 210,215 L 215,230 C 120,255 50,195 90,135 C 150,55 250,65 238,150 C 228,235 130,245 80,185 Z" fill="url(#markDarkGrad)" opacity="0.75" />

      <!-- Smooth Overlay Arc for 'e' Middle Bar -->
      <path d="M 100,150 C 130,150 200,140 220,120 C 210,140 140,165 100,150 Z" fill="url(#markLightGrad)" opacity="0.9" />

      <!-- Dot Accent -->
      <circle cx="218" cy="118" r="14" fill="url(#dotGrad)" />
    </g>

    <!-- TYPOGRAPHY (Lower-case, Light Gray) -->
    <g transform="translate(280, 0)">
      
      <!-- 'eds' -->
      <text x="0" y="150" 
            font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="110" 
            font-weight="500" 
            letter-spacing="-1" 
            fill="url(#mainTextGrad)">eds</text>
      
      <!-- Subtle Underline Divider -->
      <line x1="0" y1="180" x2="310" y2="180" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />

      <!-- 'publishing' -->
      <text x="5" y="222" 
            font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="36" 
            font-weight="300" 
            letter-spacing="5" 
            fill="url(#subTextGrad)">publishing</text>
    </g>

  </g>
</svg>

